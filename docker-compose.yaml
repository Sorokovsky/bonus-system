version: '3.9'
services:
  database:
    image: mysql:latest
    container_name: bonus-system.database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: wordpress
      MYSQL_DATABASE: bonus-system
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    ports:
      - "3310:3306"
    volumes:
      - ./.srv/database:/var/lib/mysql
  wordpress:
    image: wordpress:latest
    container_name: bonus-system.wordpress
    restart: always
    environment:
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: bonus-system
    ports:
      - "8000:80"
    volumes:
      - ./.srv/wordpress:/var/www/html
      - ./themes/:/var/www/html/wp-content/themes
      - ./plugins/:/var/www/html/wp-content/plugins
      - ./mu-plugins/:/var/www/html/wp-content/mu-plugins
      - ./.srv/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - database
    links:
      - database
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: bonus-system.phpmyadmin
    environment:
      MYSQL_USERNAME: wordpress
      MYSQL_ROOT_PASSWORD: wordpress
      PMA_HOST: database
    ports:
      - "8181:80"
    depends_on:
      - database
    links:
      - database